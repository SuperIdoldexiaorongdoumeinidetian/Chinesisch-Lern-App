<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanzi-Lern-App</title>

    <!-- PWA: Farbe der Statusleiste und iOS-Homescreen-Verhalten -->
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- iOS: als eigenständige App vom Homescreen starten (ohne Safari-Leiste) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hanzi" />

    <!-- Hanzi werden in Kaiti SC (macOS-Systemschrift) angezeigt;
         Noto Sans SC dient als Fallback auf Geräten ohne Kaiti -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kaiti+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>2
